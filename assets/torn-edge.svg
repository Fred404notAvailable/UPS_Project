<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" role="img">
  <title>Torn Ink Edge Boundary</title>
  <desc>Torn paper boundary mask with scattered ink fragments separating the hero from the lower content.</desc>

  <style>
    :root {
      fill: #0B0B0B;
    }
    path, polygon, circle, rect {
      fill: #0B0B0B;
    }
  </style>

  <!-- Main near-black torn boundary -->
  <path fill="#0B0B0B" d="
    M 0 0
    L 1440 0
    L 1440 54
    L 1410 62 L 1380 48 L 1340 68 L 1300 52 L 1270 74 L 1230 46 L 1190 64
    L 1150 50 L 1110 76 L 1070 48 L 1030 70 L 990 42 L 950 66 L 910 52
    L 870 78 L 830 46 L 790 68 L 750 40 L 710 72 L 670 48 L 630 64
    L 590 38 L 550 74 L 510 44 L 470 66 L 430 48 L 390 80 L 350 42
    L 310 68 L 270 46 L 230 76 L 190 44 L 150 70 L 110 48 L 70 72
    L 30 44 L 0 68
    Z" />

  <!-- 12 Detached ink fragments beyond the edge, sizes 6 to 36px -->
  <g class="ink-droplets" fill="#0B0B0B">
    <!-- Fragment 1 -->
    <polygon points="65,82 78,80 72,92 60,88" />
    <!-- Fragment 2 -->
    <circle cx="180" cy="86" r="5" />
    <!-- Fragment 3 -->
    <polygon points="290,92 312,88 304,104 286,98" />
    <!-- Fragment 4 -->
    <rect x="415" y="85" width="8" height="6" transform="rotate(25 419 88)" />
    <!-- Fragment 5 -->
    <polygon points="530,94 546,90 540,106 524,100" />
    <!-- Fragment 6 -->
    <circle cx="650" cy="84" r="4" />
    <!-- Fragment 7 -->
    <polygon points="760,86 788,82 780,100 754,96" />
    <!-- Fragment 8 -->
    <rect x="885" y="88" width="10" height="7" transform="rotate(-15 890 91)" />
    <!-- Fragment 9 -->
    <polygon points="1010,90 1028,84 1022,98 1006,94" />
    <!-- Fragment 10 -->
    <circle cx="1135" cy="85" r="5" />
    <!-- Fragment 11 -->
    <polygon points="1250,88 1276,82 1268,102 1244,96" />
    <!-- Fragment 12 -->
    <rect x="1360" y="82" width="7" height="6" transform="rotate(40 1363 85)" />
  </g>
</svg>
